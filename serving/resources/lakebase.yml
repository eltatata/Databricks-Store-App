      scheduling_policy: SNAPSHOT
      branch: projects/${resources.postgres_projects.store_app.project_id}/branches/${var.lakebase_branch_id}
      postgres_database: ${var.lakebase_database}
      create_database_objects_if_missing: true
      existing_pipeline_id: ${resources.postgres_synced_tables.kpi_daily.status.pipeline_id}

    product_performance:
      synced_table_id: ${var.catalog}.serving.product_performance
      source_table_full_name: ${var.catalog}.gold.product_performance
